---
kind: DataManagerJobDefinition
kind-version: '2021.1'

name: Calculate Mordred descriptors
collection: im-virtual-screening

jobs:
  mordred-descriptor-generator:
    name: 2D Mordred descriptor calculator (legacy, mordred 1.2.0)
    description: >-
      Calculate 2D Mordred descriptors with the original mordred 1.2.0 on rdkit
      2023.9.6, reproducing the legacy library versions so pre-trained legacy models can be
      served (mordredcommunity, which main uses, changes some values). Writes a
      sidecar manifest (.manifest.json) the predictor checks against the model.
      For exact legacy reproduction use fragment method 'none'.
    version: '1.0.1'
    category: comp chem
    keywords:
    - rdkit
    - mordred
    - descriptors
    image:
      name: informaticsmatters/mordred-descriptors
      tag: 'legacy'
      project-directory: /data
      working-directory: /data
      fix-permissions: true
    command: >-
      python /code/descriptor_generator.py -i '{{ inputFile }}' -o '{{ outputFile }}'
      {% if fragment is defined %}--fragment-method '{{ fragment }}'{% endif %}
      {% if readHeader is defined and readHeader %}--read-header{% endif %}
      {% if writeHeader is defined and writeHeader %}--write-header{% endif %}
      {% if separator is defined %}--delimiter '{{ separator }}'{% endif %}
      {% if readRecords is defined %}--read-records '{{ readRecords }}'{% endif %}
      {% if idColumn is defined %}--id-column '{{ idColumn }}'{% endif %}
      --interval 1000
    variables:
      order:
        options:
        - outputFile
        - fragment
        # - calc3d
        - readHeader
        - writeHeader
        - separator
        - idColumn
        - readRecords
      inputs:
        type: object
        required:
        - inputFile
        properties:
          inputFile:
            title: Input molecules
            mime-types:
            - chemical/x-mdl-sdfile
            - squonk/x-smiles
            type: file
      outputs:
        type: object
        properties:
          outputFile:
            title: Output file
            mime-types:
            - chemical/x-mdl-sdfile
            - squonk/x-smiles
            creates: '{{ outputFile }}'
            type: file
          manifestFile:
            title: Descriptor manifest
            mime-types:
            - application/json
            creates: '{{ (outputFile[:-3] if outputFile.endswith(".gz") else outputFile).rsplit(".", 1)[0] }}.manifest.json'
            type: file
      options:
        type: object
        required:
        - outputFile
        properties:
          outputFile:
            title: Output file name
            type: string
            pattern: "^[A-Za-z0-9_/\\.\\-]+$"
            default: mordred_descriptors.sdf
          fragment:
            title: Fragment method
            type: string
            default: hac
            enum:
            - hac
            - mw
            - none
          # calc3d:
          #   title: Calculate 3D descriptors (requires 3D structures)
          #   type: boolean
          readHeader:
            title: Input has header line (text formats only)
            type: boolean
          writeHeader:
            title: Output has header line (text formats only)
            type: boolean
            default: true
          separator:
            title: Separator for text formats
            type: string
            default: tab
            enum:
            - tab
            - comma
            - space
            - pipe
          idColumn:
            title: Index (text) or name (SDF) to use for the ID field
            type: string
            pattern: "^[A-Za-z0-9_\\.\\- ]+$"
          readRecords:
            title: Number of records to read field names
            type: integer
            default: 100
    tests:
      execution-2d:
        inputs:
          inputFile: data/10.smi
        options:
          outputFile: foo/descriptors2d.smi
          writeHeader: true
        checks:
          exitCode: 0
          outputs:
          - name: foo/descriptors2d.smi
            checks:
            - exists: true
            - lineCount: 11
          - name: foo/descriptors2d.manifest.json
            checks:
            - exists: true
