---
name: test

# A callable workflow to execute repository tests.

on:
  workflow_call:

env:
  # Match the Dockerfile, so CI resolves dependencies the way the image does.
  POETRY_VERSION: 2.1.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Match 'python' in pyproject.toml and the Dockerfile base image.
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir poetry=="${{ env.POETRY_VERSION }}"
        # Into a virtualenv, NOT 'POETRY_VIRTUALENVS_CREATE=false'. The dev
        # group and poetry share dependencies - filelock, platformdirs and
        # virtualenv itself - and installing the group alongside poetry
        # replaces them underneath it, mid-install, from parallel threads.
        # In squonk2-skl that left poetry unable to import its own code:
        # 'FileNotFoundError: .../python_discovery/_py_info_collect.py'.
        # Hence 'poetry run' on the step below.
        poetry install --only dev --no-root --no-directory
    - name: Jote
      run: poetry run jote --dry-run
